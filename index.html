<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLAGGED 🚩</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="app">
        <div class="logo">🚩</div>

        <h1>FLAGGED</h1>
        <p class="subtitle">Red flag or not?</p>

        <section class="card">
            <div class="category">❤️ RELATIONSHIPS</div>

            <p class="situation">
                He watches all your Stories,
                but never replies to them.
            </p>

            <p class="question">What do you think?</p>

            <div class="buttons">
                <button class="normal">🟢 NORMAL</button>
                <button class="hmm">🟡 HMM...</button>
                <button class="red">🔴 RED FLAG</button>
            </div>
        </section>

        <p class="hint">You decide. We show what others think.</p>
    </main>

    <script src="script.js"></script> </body> </html>
